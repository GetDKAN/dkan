services:
  dkan.database_connection_factory:
    class: \Drupal\dkan\Storage\DatabaseConnectionFactory

  dkan.docs_generator:
    class: \Drupal\dkan\DkanApiDocsGenerator
    arguments:
      - '@plugin.manager.dkan_api_docs'
      - '@settings'

  dkan.job_store:
    class: \Drupal\dkan\Storage\JobStoreFactory
    arguments:
      - '@database'
      - '@event_dispatcher'

  dkan.drupal_files:
    class: \Drupal\dkan\Util\DrupalFiles
    arguments:
      - '@file_system'
      - '@stream_wrapper_manager'
      - '@http_client_factory'
      - '@dkan.logger_channel'

  dkan.node_storage:
    class: Drupal\node\NodeStorage
    factory: entity_type.manager:getStorage
    arguments: ['node']

  dkan.file_fetcher:
    class: \Drupal\dkan\FileFetcher\FileFetcherFactory
    arguments:
      - '@dkan.filefetcher_job_store_factory'
      - '@config.factory'

  dkan.filefetcher_job_store_factory:
    class: \Drupal\dkan\Storage\FileFetcherJobStoreFactory
    arguments:
      - '@database'
      - '@event_dispatcher'

  dkan.dataset_info:
    class: \Drupal\dkan\DatasetInfo
    arguments:
      - '@plugin.manager.dataset_info'
    calls:
      - [setStorage, ['@?dkan.metastore.storage']]
      - [setResourceMapper, ['@?dkan.metastore.resource_mapper']]

  dkan.logger_channel:
    parent: logger.channel_base
    arguments: [ 'dkan' ]

  dkan.stream_wrapper:
    class: \Drupal\dkan\StreamWrapper\DkanStreamWrapper
    tags:
      - { name: stream_wrapper, scheme: dkan }

  plugin.manager.dataset_info:
    class: Drupal\dkan\DatasetInfoPluginManager
    parent: default_plugin_manager

  plugin.manager.dkan_api_docs:
    class: \Drupal\dkan\Plugin\DkanApiDocsPluginManager
    parent: default_plugin_manager
