dkan.settings:
  type: config_object
  label: 'DKAN Settings'
  mapping:
    always_use_existing_local_perspective:
      label: 'If a local file is in place, use it.'
      type: boolean
user.role.api_user:
  type: config_object
  label: 'API user'
  mapping:
    id:
      type: string
      label: 'ID'
    uuid:
      type: string
      label: 'UUID'
    label:
      type: string
      label: 'Label'
    weight:
      type: integer
      label: 'Weight'
    is_admin:
      type: boolean
      label: 'Is admin'
    permissions:
      type: sequence
      label: 'Permissions'
      sequence:
        type: string
        label: 'Permission'
    status:
      type: boolean
      label: 'Status'
    dependencies:
      type: config_dependencies
      label: 'Dependencies'
system.action.user_remove_role_action.api_user:
  type: config_object
  label: 'Remove API user role'
  mapping:
    id:
      type: string
      label: 'ID'
    uuid:
      type: string
      label: 'UUID'
    label:
      type: string
      label: 'Label'
    status:
      type: boolean
      label: 'Status'
    dependencies:
      type: config_dependencies
      label: 'Dependencies'
    type:
      type: string
      label: 'Type'
    configuration:
      type: config_object
      label: 'Configuration'
      mapping:
        rid:
          type: string
          label: 'RID'
    plugin:
      type: string
      label: 'Plugin'
system.action.user_add_role_action.api_user:
  type: config_object
  label: 'Add API user role'
  mapping:
    id:
      type: string
      label: 'ID'
    uuid:
      type: string
      label: 'UUID'
    label:
      type: string
      label: 'Label'
    status:
      type: boolean
      label: 'Status'
    dependencies:
      type: config_dependencies
      label: 'Dependencies'
    type:
      type: string
      label: 'Type'
    configuration:
      type: config_object
      label: 'Configuration'
      mapping:
        rid:
          type: string
          label: 'RID'
    plugin:
      type: string
      label: 'Plugin'