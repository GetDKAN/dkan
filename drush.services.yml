services:
  dkan.commands:
    class: \Drupal\dkan\Commands\DkanCommands
    tags:
      - { name: drush.command }
    arguments:
      - '@dkan.dataset_info'

  dkan.jobstore.commands:
    class: \Drupal\dkan\Commands\JobStoreCommands
    tags:
      - { name: drush.command }
    arguments:
      - '@database'
