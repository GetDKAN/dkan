config_version = "0"

exclude_patterns = [
  "cypress/",
  "config/",
  "db/",
  "dist/",
  "docs/",
  "documentation/",
  "features/",
  "**/node_modules/",
  "script/",
  "**/spec/",
  "**/test/",
  "**/tests/",
  "Tests/",
  "**/vendor/",
  "**/*_test.go",
  "**/*.d.ts",
  "**/*.yml",
  "**/*.json",
  "**/*.js",
  "**/*.jsx",
  "*.md",
  "**/*.md",
  "*.install",
  "*.profile",
  "*.module",
  "*.xml",
  "**/*.xml",
  "**/*.install",
  "**/*.profile",
  "**/*.module",
  ".circleci/",
  ".gitignore",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "block"

[[source]]
name = "default"
default = true

[[plugin]]
name = "bandit"
version = "1.7.9"

[[plugin]]
name = "checkov"

[[plugin]]
name = "golangci-lint"

[[plugin]]
name = "markdownlint"
version = "0.41.0"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "php-codesniffer"

[[plugin]]
name = "phpstan"

[[plugin]]
name = "prettier"

[[plugin]]
name = "ripgrep"

[[plugin]]
name = "ruff"
version = "0.5.3"

[[plugin]]
name = "trivy"
drivers = [
  "config",
  "fs-vuln",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"
