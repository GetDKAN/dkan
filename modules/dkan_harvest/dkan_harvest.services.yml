services:
  dkan.harvest.service:
    class: Drupal\dkan_harvest\HarvestService
    arguments:
      - '@dkan.harvest.storage.database_table'
      - '@dkan.harvest.storage.hashes_database_table'
      - '@dkan.metastore.service'
      - '@dkan.harvest.harvest_plan_repository'
      - '@dkan.harvest.storage.harvest_run_repository'
      - '@dkan.harvest.logger_channel'
    calls:
      - [ setEntityTypeManager, [ '@entity_type.manager' ] ]
  Drupal\dkan_harvest\HarvestService: '@dkan.harvest.service'
  dkan.harvest.utility:
    class: Drupal\dkan_harvest\HarvestUtility
    arguments:
      - '@dkan.harvest.service'
      - '@dkan.harvest.storage.database_table'
      - '@dkan.harvest.storage.hashes_database_table'
      - '@dkan.harvest.storage.harvest_run_repository'
      - '@database'
      - '@dkan.harvest.logger_channel'
      - '@uuid'
  dkan.harvest.harvest_plan_repository:
    class: Drupal\dkan_harvest\Entity\HarvestPlanRepository
    arguments:
      - '@entity_type.manager'
  dkan.harvest.storage.database_table:
    class: Drupal\dkan_harvest\Storage\DatabaseTableFactory
    arguments:
      - '@database'
      - '@event_dispatcher'
  dkan.harvest.storage.hashes_database_table:
    class: Drupal\dkan_harvest\Storage\HarvestHashesDatabaseTableFactory
    arguments:
      - '@entity_type.manager'
  dkan.harvest.storage.harvest_run_repository:
    class: Drupal\dkan_harvest\Entity\HarvestRunRepository
    arguments:
      - '@database'
      - '@entity_type.manager'
  dkan.harvest.logger_channel:
      parent: logger.channel_base
      arguments: ['harvest']
