services:
  dkan.metastore.service:
    class: \Drupal\dkan_metastore\MetastoreService
    arguments:
      - '@dkan.metastore.schema_retriever'
      - '@dkan.metastore.storage'
      - '@dkan.metastore.valid_metadata'
      - '@dkan.common.logger_channel'
      - '@event_dispatcher'
  Drupal\dkan_metastore\MetastoreService: '@dkan.metastore.service'

  dkan.metastore.lifecycle:
    class: \Drupal\dkan_metastore\LifeCycle\LifeCycle
    arguments:
      - '@dkan.metastore.referencer'
      - '@dkan.metastore.dereferencer'
      - '@dkan.metastore.orphan_checker'
      - '@dkan.metastore.storage'
      - '@queue'
      - '@config.factory'
      - '@event_dispatcher'

  dkan.metastore.schema_retriever:
    class: \Drupal\dkan_metastore\SchemaRetriever
    arguments:
      - '%app.root%'
      - '@extension.list.module'
    shared: false

  dkan.metastore.schema_properties_helper:
    class: \Drupal\dkan_metastore\SchemaPropertiesHelper
    arguments:
      - '@dkan.metastore.schema_retriever'
  Drupal\dkan_metastore\SchemaPropertiesHelper: '@dkan.metastore.schema_properties_helper'

  dkan.metastore.storage:
    class: \Drupal\dkan_metastore\Storage\DataFactory
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@file_system'
      - '@dkan.common.logger_channel'
      - '@event_dispatcher'
  Drupal\dkan_metastore\Storage\DataFactory: '@dkan.metastore.storage'

  dkan.metastore.referencer:
    class: \Drupal\dkan_metastore\Reference\Referencer
    arguments:
      - '@config.factory'
      - '@dkan.metastore.storage'
      - '@dkan.metastore.url_generator'
      - '@http_client'
      - '@file.mime_type.guesser.extension'
      - '@dkan.metastore.resource_mapper'
      - '@dkan.common.logger_channel'

  dkan.metastore.dereferencer:
    class: \Drupal\dkan_metastore\Reference\Dereferencer
    arguments:
      - '@config.factory'
      - '@dkan.metastore.storage'
      - '@dkan.metastore.url_generator'
      - '@dkan.metastore.resource_mapper'
      - '@dkan.common.logger_channel'
  Drupal\dkan_metastore\Reference\Dereferencer: '@dkan.metastore.dereferencer'

  dkan.metastore.orphan_checker:
    class: \Drupal\dkan_metastore\Reference\OrphanChecker
    arguments:
      - '@config.factory'
      - '@queue'

  dkan.metastore.orphan_node_processor:
    class: \Drupal\dkan_metastore\Service\OrphanNodeProcessor
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@datetime.time'

  dkan.metastore.resource_mapper:
    class: \Drupal\dkan_metastore\ResourceMapper
    arguments:
      - '@entity_type.manager'
      - '@event_dispatcher'
  Drupal\dkan_metastore\ResourceMapper: '@dkan.metastore.resource_mapper'

  dkan.metastore.event_subscriber:
    class: \Drupal\dkan_metastore\EventSubscriber\MetastoreSubscriber
    arguments:
      - '@dkan.metastore.service'
      - '@dkan.metastore.resource_mapper'
      - '@dkan.metastore.reference_lookup'
      - '@config.factory'
    tags:
      - { name: event_subscriber }

  dkan.metastore.valid_metadata:
    class: \Drupal\dkan_metastore\ValidMetadataFactory
    arguments:
      - '@dkan.metastore.schema_retriever'
  \Drupal\dkan_metastore\ValidMetadataFactory: '@dkan.metastore.valid_metadata'

  dkan.metastore.metastore_item_factory:
    class: \Drupal\dkan_metastore\NodeWrapper\NodeDataFactory
    arguments:
      - '@entity.repository'
      - '@entity_type.manager'
  Drupal\dkan_metastore\NodeWrapper\NodeDataFactory: '@dkan.metastore.metastore_item_factory'

  dkan.metastore.dataset_api_docs:
    class: \Drupal\dkan_metastore\DatasetApiDocs
    arguments:
      - '@dkan.common.docs_generator'
      - '@dkan.metastore.service'
      - '@settings'

  dkan.metastore.api_response:
    class: \Drupal\dkan_metastore\MetastoreApiResponse
    arguments:
      - '@dkan.metastore.metastore_item_factory'

  dkan.metastore.reference_lookup:
    class: \Drupal\dkan_metastore\Reference\ReferenceLookup
    arguments:
      - '@dkan.metastore.storage'
      - '@dkan.metastore.metastore_item_factory'
      - '@cache_tags.invalidator'
      - '@module_handler'

  dkan.metastore.url_generator:
    class: \Drupal\dkan_metastore\Reference\MetastoreUrlGenerator
    arguments:
      - '@stream_wrapper_manager'
      - '@dkan.metastore.service'
      - '@request_stack'

  dkan.metastore.data_dictionary_discovery:
    class: \Drupal\dkan_metastore\DataDictionary\DataDictionaryDiscovery
    arguments:
      - '@config.factory'
      - '@dkan.metastore.service'
      - '@dkan.metastore.reference_lookup'
      - '@dkan.metastore.url_generator'

  dkan.metastore.schema_validator:
    class: \Drupal\dkan_metastore\SchemaValidator
    arguments:
      - '@dkan.metastore.schema_retriever'
