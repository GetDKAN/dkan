dkan_datastore.1.datastore:
  path: '/api/1/datastore'
  methods: [GET]
  defaults:
    _controller: '\Drupal\dkan_common\Controller\OpenApiController::getComplete'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: [ 'basic_auth', 'cookie' ]

dkan_datastore.1.imports:
  path: '/api/1/datastore/imports'
  methods: [GET]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\ImportController::list'
    is_dkan_api_route: true
  requirements:
    _permission: 'datastore_api_import'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.imports.post:
  path: '/api/1/datastore/imports'
  methods: [POST]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\ImportController::import'
    is_dkan_api_route: true
    deferred: false
  requirements:
    _permission: 'datastore_api_import'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.imports.id:
  path: '/api/1/datastore/imports/{identifier}'
  methods: [GET]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\ImportController::summary'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.imports.delete:
  path: '/api/1/datastore/imports'
  methods: [DELETE]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\ImportController::deleteMultiple'
    is_dkan_api_route: true
  requirements:
    _permission: 'datastore_api_drop'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.imports.id.delete:
  path: '/api/1/datastore/imports/{identifier}'
  methods: [DELETE]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\ImportController::delete'
    is_dkan_api_route: true
  requirements:
    _permission: 'datastore_api_drop'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.query:
  path: '/api/1/datastore/query'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\QueryController::query'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.query.download:
  path: '/api/1/datastore/query/download'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\QueryDownloadController::query'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.query.id:
  path: '/api/1/datastore/query/{identifier}'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\QueryController::queryResource'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.query.id.download:
  path: '/api/1/datastore/query/{identifier}/download'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\QueryDownloadController::queryResource'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.query.dataset.index:
  path: '/api/1/datastore/query/{dataset}/{index}'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\QueryController::queryDatasetResource'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.query.dataset.index.download:
  path: '/api/1/datastore/query/{dataset}/{index}/download'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\QueryDownloadController::queryDatasetResource'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.1.query.schema.get:
  path: '/api/1/datastore/query/schema'
  methods: [GET]
  defaults:
    _controller: '\Drupal\dkan_datastore\Controller\QueryController::querySchema'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.sql_endpoint.get.api:
  path: '/api/1/datastore/sql'
  methods: [GET]
  defaults:
    _controller: '\Drupal\dkan_datastore\SqlEndpoint\WebServiceApi::runQueryGet'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan_datastore.sql_endpoint.post.api:
  path: '/api/1/datastore/sql'
  methods: [POST]
  defaults:
    _controller: '\Drupal\dkan_datastore\SqlEndpoint\WebServiceApi::runQueryPost'
    is_dkan_api_route: true
  requirements:
    _access: 'TRUE'

dkan_datastore.dkan_resource_settings:
  path: '/admin/dkan/resources'
  defaults:
    _title: 'Resource Settings'
    _form: 'Drupal\dkan_datastore\Form\ResourceSettingsForm'
  requirements:
    _permission: 'administer site configuration'

dkan_datastore.datasets_import_status_dashboard:
  path: '/admin/dkan/datastore/status'
  methods: [ GET ]
  defaults:
    _title: 'Datastore Import Status'
    _form: 'Drupal\dkan_datastore\Form\DashboardForm'
  requirements:
    _permission: 'dkan.harvest.dashboard'
  options:
    _auth: [ 'basic_auth', 'cookie' ]

dkan_datastore.settings:
  path: '/admin/dkan/datastore'
  defaults:
    _title: 'Datastore Settings'
    _form: 'Drupal\dkan_datastore\Form\DatastoreSettingsForm'
  requirements:
    _permission: 'administer site configuration'
