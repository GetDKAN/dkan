services:
  dkan.common.database_connection_factory:
    class: \Drupal\dkan_common\Storage\DatabaseConnectionFactory

  dkan.common.docs_generator:
    class: \Drupal\dkan_common\DkanApiDocsGenerator
    arguments:
      - '@plugin.manager.dkan_api_docs'
      - '@settings'

  dkan.common.drupal_files:
    class: \Drupal\dkan_common\Util\DrupalFiles
    arguments:
      - '@file_system'
      - '@stream_wrapper_manager'
      - '@http_client_factory'
      - '@dkan.common.logger_channel'

  dkan.common.node_storage:
    class: Drupal\node\NodeStorage
    factory: entity_type.manager:getStorage
    arguments: ['node']

  dkan.common.file_fetcher:
    class: \Drupal\dkan_common\FileFetcher\FileFetcherFactory
    arguments:
      - '@dkan.common.filefetcher_job_store_factory'
      - '@config.factory'

  dkan.common.filefetcher_job_store_factory:
    class: \Drupal\dkan_common\Storage\FileFetcherJobStoreFactory
    arguments:
      - '@database'
      - '@event_dispatcher'

  dkan.common.dataset_info:
    class: \Drupal\dkan_common\DatasetInfo
    arguments:
      - '@plugin.manager.dataset_info'
    calls:
      - [setStorage, ['@?dkan.metastore.storage']]
      - [setResourceMapper, ['@?dkan.metastore.resource_mapper']]

  dkan.common.logger_channel:
    parent: logger.channel_base
    arguments: [ 'dkan' ]

  dkan.common.config_import_rename_dependencies_subscriber:
    class: Drupal\dkan_common\EventSubscriber\ConfigImportRenameDependenciesSubscriber
    tags:
      - { name: event_subscriber }

  # @deprecated
  common.docs:
    class: \Drupal\dkan_common\Controller\OpenApiController
    arguments:
      - '@module_handler'
      - '@request_stack'

  dkan.stream_wrapper:
    class: \Drupal\dkan_common\StreamWrapper\DkanStreamWrapper
    tags:
      - { name: stream_wrapper, scheme: dkan }

  plugin.manager.dataset_info:
    class: Drupal\dkan_common\DatasetInfoPluginManager
    parent: default_plugin_manager

  plugin.manager.dkan_api_docs:
    class: \Drupal\dkan_common\Plugin\DkanApiDocsPluginManager
    parent: default_plugin_manager
