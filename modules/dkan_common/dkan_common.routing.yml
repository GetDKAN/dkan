system.admin_dkan:
  path: '/admin/dkan'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: "DKAN"
  requirements:
    _permission: 'access administration pages'

dkan.common.api:
  path: '/api'
  methods: [GET]
  defaults:
    _controller: '\Drupal\dkan_common\Controller\OpenApiController::getVersions'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan.common.api.version:
  path: '/api/1'
  methods: [GET]
  defaults:
    _controller: '\Drupal\dkan_common\Controller\OpenApiController::getComplete'
    is_dkan_api_route: true
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan.common.api.version.yaml:
  path: '/api/1.yml'
  methods: [GET]
  defaults:
    _controller: '\Drupal\dkan_common\Controller\OpenApiController::getComplete'
    is_dkan_api_route: true
    format: yaml
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']
