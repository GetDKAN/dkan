# Circle CI script to run a matrix of tests in DDev.

version: 2.1

commands:
  prepare_build:
    parameters:
      php_version:
        description: "PHP major.minor for DDev to use."
        default: "8.2"
        type: string
      database_version:
        description: "Database version for DDev to use."
        default: "mysql:5.7"
        type: string
      addon_branch:
        description: "Repo branch name for the DKAN DDev add-on you want to test against."
        default: "main"
        type: string
      drupal_core_constraint:
        description: "Branch of getdkan/recommended-project to use."
        default: "10.3.x-dev"
        type: string
      upgrade:
        description: "If true, will install the latest stable version and test upgrade"
        default: false
        type: boolean
    environment:
    steps:
      - run:
          # TODO: We might not need to do this.
          name: Set up composer config
          command: |
            mkdir ~/.composer
            bash -c 'echo "{\"github-oauth\": {\"github.com\": \"$GITHUB_TOKEN\"}}"' > ~/.composer/auth.json
      - checkout
      - when:
          condition: << parameters.upgrade >>
          steps:
            - run:
                name: Switch to dev branch for upgrade testing
                command: |
                  git checkout 2.x
                  # The following should be removed once the 2.x branch has the ddev add-on config.
                  git checkout $CIRCLE_BRANCH -- composer.json

      - restore_cache:
          keys:
            - select2-v1-{{ checksum ".ddev/commands/web/select2" }}
            - select2-v1-
      - run:
          environment:
            DRUPAL_CORE: << parameters.drupal_core_constraint >>
            DRUPAL_PROJECTS_PATH: modules/custom
          name: Build site codebase
          command: |
            set -ex
            # Here we replicate the ddev poser command
            curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/expand_composer_json.php
            php expand_composer_json.php dkan
            rm -rf expand_composer_json.php
            composer install
            rm -f composer.contrib.json composer.contrib.lock
            export DOCROOT=$CIRCLE_WORKING_DIRECTORY/web
            .ddev/commands/web/select2

            # Now replicate ddev symlink-project
            curl -OL https://git.drupalcode.org/project/gitlab_templates/-/raw/default-ref/scripts/symlink_project.php
            if [ -z "${PROJECT_FILES-}" ]; then
              # Suppress a warning.
              PROJECT_FILES=$(ls -A --ignore="web" --ignore="vendor" --ignore="symlink_project.php" --ignore=".ddev" --ignore=".idea")
              export PROJECT_FILES
            fi
            export DRUPAL_PROJECT_FOLDER=${DOCROOT}/${DRUPAL_PROJECTS_PATH}/dkan//-/_}
            php symlink_project.php
            rm -f symlink_project.php
      - save_cache:
          key: select2-v1-{{ checksum ".ddev/commands/web/select2" }}
          paths:
            - web/libraries/select2
      - run:
          name: Install site
          environment:
            PATH: /home/circleci/project/vendor/bin:$PATH
          command: |
            .ddev/commands/web/dkan-site-install
            drush rq
      - when:
          condition: << parameters.upgrade >>
          steps:
            - run:
                name: Update to testing branch
                command: |
                  git stash
                  git checkout $CIRCLE_BRANCH
                  ddev poser
                  ddev drush updb -y
                  ddev drush cr
                  ddev drush rq

jobs:
  phpunit:
    docker:
      - image: cimg/php:<< parameters.php_version >>
      - image: cimg/<< parameters.database_version >>
    parallelism: 4
    parameters:
      php_version:
        description: "PHP major.minor for DDev to use."
        default: "8.1"
        type: string
      database_version:
        description: "Database version for DDev to use."
        default: "mysql:5.7"
        type: string
      drupal_core_constraint:
        description: "Branch of getdkan/recommended-project to use."
        default: "~10.4"
        type: string
      report_coverage:
        description: "Generate coverage report and send it to Qlty"
        default: false
        type: boolean
      upgrade:
        description: "If true, will install the latest stable DKAN version and test upgrade"
        default: false
        type: boolean
    steps:
      - prepare_build:
          php_version: << parameters.php_version >>
          database_version: << parameters.database_version >>
          drupal_core_constraint: << parameters.drupal_core_constraint >>
          upgrade: << parameters.upgrade >>
      - run:
          name: Set up GROUP_ARG variable for parallel tests
          command: |
            if [[ $CIRCLE_NODE_INDEX == 0 ]]; then
              # Get phpunit major version
              PHPUNIT_VERSION=$(composer show phpunit/phpunit | grep versions | awk '{print $4}' | cut -d. -f1)

              if [[ $PHPUNIT_VERSION -lt 11 ]]; then
                # For phpunit < 11, use comma-separated syntax
                EXCLUDES="--exclude-group "
                for i in $(seq 1 $(($CIRCLE_NODE_TOTAL-1))); do
                  if [[ $i -gt 1 ]]; then
                    EXCLUDES="${EXCLUDES},functional$i"
                  else
                    EXCLUDES="${EXCLUDES}functional$i"
                  fi
                done
                PHPUNIT_GROUP_ARG="$EXCLUDES"
              else
                # For phpunit >= 11, use multiple --exclude-group flags
                EXCLUDES=""
                for i in $(seq 1 $(($CIRCLE_NODE_TOTAL-1))); do
                  EXCLUDES="$EXCLUDES --exclude-group functional$i"
                done
                PHPUNIT_GROUP_ARG="$EXCLUDES"
              fi
            else
              PHPUNIT_GROUP_ARG="--group functional$CIRCLE_NODE_INDEX"
            fi
            echo "export PHPUNIT_GROUP_ARG=\"$PHPUNIT_GROUP_ARG\"" >> $BASH_ENV
      - when:
          condition: << parameters.report_coverage >>
          steps:
            - run:
                name: Run PHPUnit tests with coverage report
                environment:
                  XDEBUG_MODE: coverage
                  QLTY_COVERAGE_TOKEN: ${QLTY_COVERAGE_TOKEN}
                command: |
                  mkdir -p $CIRCLE_WORKING_DIRECTORY/report/php
                  mkdir -p $CIRCLE_WORKING_DIRECTORY/report/clover
                  $CIRCLE_WORKING_DIRECTORY/vendor/bin/phpunit  $PHPUNIT_GROUP_ARG \
                    --coverage-clover /var/www/html/report/clover/clover-$CIRCLE_NODE_INDEX.xml \
                    --coverage-php /var/www/html/report/php/coverage-$CIRCLE_NODE_INDEX.cov \
                    --log-junit /var/www/html/report/junit/junit.xml
                  TEST_RESULT=$?
                  echo "Listing all files in the report directory:"
                  find $CIRCLE_WORKING_DIRECTORY/report -type f -ls
                  if [ -f $CIRCLE_WORKING_DIRECTORY/report/clover/clover-$CIRCLE_NODE_INDEX.xml ]; then
                    echo "Coverage file: $CIRCLE_WORKING_DIRECTORY/report/clover/clover-$CIRCLE_NODE_INDEX.xml"
                  else
                    echo "Coverage file not created: $CIRCLE_WORKING_DIRECTORY/report/clover/clover-$CIRCLE_NODE_INDEX.xml"
                  fi
                  exit $TEST_RESULT
            - run:
                name: Upload coverage report to qlty.sh
                command: |
                  curl https://qlty.sh | sh
                  source /home/circleci/.bash_profile
                  qlty coverage publish \
                    --strip-prefix "/var/www/html" \
                    --total-parts-count $CIRCLE_NODE_TOTAL \
                    $CIRCLE_WORKING_DIRECTORY/report/clover/clover-$CIRCLE_NODE_INDEX.xml
            - persist_to_workspace:
                root: report
                paths:
                  - php
      - unless:
          condition: << parameters.report_coverage >>
          steps:
            - run:
                name: Run PHPUnit tests
                command: |
                  $CIRCLE_WORKING_DIRECTORY/vendor/bin/phpunit \
                    $PHPUNIT_GROUP_ARG \
                    --log-junit /var/www/html/report/junit/junit.xml
      - store_test_results:
          path: report/junit

  cypress:
    docker:
      - image: cimg/php:<< parameters.php_version >>-browsers
      - image: cimg/<< parameters.database_version >>
    parallelism: 4
    parameters:
      php_version:
        description: "PHP major.minor for DDev to use."
        default: "8.3"
        type: string
      database_version:
        description: "Database version for DDev to use."
        default: "mysql:5.7"
        type: string
      drupal_core_constraint:
        description: "Branch of getdkan/recommended-project to use."
        default: "~10.5.0"
        type: string
      upgrade:
        description: "If true, will install the latest stable DKAN version and test upgrade"
        default: false
        type: boolean
    steps:
      - prepare_build:
          php_version: << parameters.php_version >>
          database_version: << parameters.database_version >>
          drupal_core_constraint: << parameters.drupal_core_constraint >>
          upgrade: << parameters.upgrade >>
      - run:
          name: Run Cypress tests
          max_auto_reruns: 3
          command: |
            mkdir cypress/tmp
            mkdir cypress/results
            mv $(circleci tests glob cypress/e2e/*.cy.js | circleci tests split --split-by=timings) cypress/tmp || true
            rm cypress/e2e/*
            mv cypress/tmp/* cypress/e2e
            npm install cypress --save-dev
            ./.ddev/commands/host/dkan-module-test-cypress \
              --headless \
              --reporter junit \
              --reporter-options "mochaFile=cypress/results/cypress-results-[hash].xml"
      - store_artifacts:
          path: cypress/screenshots
      - store_artifacts:
          path: cypress/videos
      - store_test_results:
          path: cypress/results

workflows:
  version: 2
  install_and_test:
    # We use matrix for these parameters so that we can tell them apart in report screens.
    jobs:
      - cypress:
          name: install_test_cypress
          drupal_core_constraint: "~10.5.0"
      - phpunit:
          name: "Install target (Drupal 10.5, PHP 8.3)"
          report_coverage: true
          matrix:
            parameters:
              drupal_core_constraint: ["~10.5.0"]
              php_version: ["8.3"]
              database_version: ["mysql:5.7"]
      - phpunit:
          matrix:
            parameters:
              drupal_core_constraint: ["~10.6.0", "~11.2.0"]
              php_version: ["8.3"]
              database_version: ["mariadb:10.11"]
      - phpunit:
          matrix:
            parameters:
              drupal_core_constraint: ["10.6.0", "~11.2.0"]
              php_version: ["8.4"]
              database_version: ["mariadb:10.11"]
      - phpunit:
          matrix:
            parameters:
              drupal_core_constraint: ["~10.5.0"]
              php_version: ["8.1", "8.2", "8.4"]
              database_version: ["mysql:5.7"]


  upgrade_and_test:
    jobs:
      - cypress:
          name: upgrade_test_cypress
          upgrade: true
          drupal_core_constraint: "~10.5.0"
