system.admin_dkan:
  path: '/admin/dkan'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: "DKAN"
  requirements:
    _permission: 'access administration pages'

dkan.api:
  path: '/api'
  methods: [GET]
  defaults:
    { _controller: '\Drupal\dkan\Controller\OpenApiController::getVersions'}
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan.api.version:
  path: '/api/1'
  methods: [GET]
  defaults:
    { _controller: '\Drupal\dkan\Controller\OpenApiController::getComplete'}
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']

dkan.api.version.yaml:
  path: '/api/1.yml'
  methods: [GET]
  defaults:
    _controller: '\Drupal\dkan\Controller\OpenApiController::getComplete'
    format: yaml
  requirements:
    _permission: 'access content'
  options:
    _auth: ['basic_auth', 'cookie']
